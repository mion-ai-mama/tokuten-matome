<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>特典まとめ｜みおん｜在宅ワークの3児ママ</title>
    <meta
      name="description"
      content="Instagramで配布してきた特典を1枚にまとめました。ChatGPT・AI活用、画像/動画づくり、AIで副業・在宅ワークの3カテゴリーから探せます。"
    />
    <link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- ===== 1. ヒーロー ===== -->
    <header class="hero">
      <div class="wrap">
        <p class="hero__label">AI初心者さん向け 無料特典</p>
        <h1 class="hero__title">
          これまでの特典、<br /><span class="mark">ぜんぶここに集めました</span>
        </h1>
        <p class="hero__lead">
          気になるものを、気になったときに。<br />
          カテゴリーとキーワードから探せます。
        </p>
        <p class="hero__count">
          <strong id="total-count">26</strong><span>件の特典</span>
        </p>

        <!-- ===== 2. プロフィール ===== -->
        <div class="profile">
          <span class="profile__name">みおん｜在宅ワークの3児ママ</span>
          <a
            class="profile__link"
            href="https://www.instagram.com/mion.ai.mama/"
            target="_blank"
            rel="noopener noreferrer"
            >📷 @mion.ai.mama</a
          >
        </div>
      </div>
    </header>

    <!-- ===== 3. 絞り込みバー ===== -->
    <div class="filter">
      <div class="wrap">
        <div class="filter__search">
          <label class="visually-hidden" for="search" hidden>キーワード検索</label>
          <input
            id="search"
            type="search"
            autocomplete="off"
            placeholder="キーワードで探す（例: プロンプト、LINE）"
          />
        </div>
        <div class="filter__tabs" id="tabs" role="tablist"></div>
      </div>
    </div>

    <!-- ===== 4-5. カード一覧 / プロンプト表示 ===== -->
    <main class="list">
      <div class="wrap">
        <p class="list__status" id="status"></p>
        <ul class="cards" id="cards"></ul>
      </div>
    </main>

    <!-- ===== 6. CTA ===== -->
    <section class="cta">
      <div class="wrap">
        <h2 class="cta__heading">
          AIをもっと仕事や暮らしに<br />活かしてみたい方へ
        </h2>
        <p class="cta__text">
          AIを知るだけではなく、実際の仕事や日々の作業にどう活かすかを知ることで、<br />
          できることはさらに広がります。無料でご用意しています。
        </p>
        <a
          class="cta__banner"
          href="https://sub.aione.co.jp/line/open/ErxG3f10mmcK?mtid=8LTecV7UlNz5"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="assets/images/cta-banner.jpg"
            alt="無料プレゼント AIマネタイズ教科書。AIで働き方の選択肢を広げたい方へ。LINE登録はこちら"
          />
        </a>
      </div>
    </section>

    <!-- ===== 7. フッター ===== -->
    <footer class="footer">
      <div class="wrap">
        <a
          class="footer__link"
          href="https://www.instagram.com/mion.ai.mama/"
          target="_blank"
          rel="noopener noreferrer"
          >📷 @mion.ai.mama</a
        >
        <p class="footer__copy">© MION</p>
      </div>
    </footer>

    <script src="js/presents.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
